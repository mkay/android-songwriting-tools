# Syncs the apps' listings and releases, commits what changed, then builds the
# site and publishes it to GitHub Pages. Daily, on every push to main, and by
# hand from the Actions tab.
#
# The commit is made with the workflow's own token, which by design does not
# start another run, so there is no loop; this run deploys it.

name: Sync and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# One deploy at a time; a newer run waits rather than cancelling one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync app listings and releases
        run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit synced changes
        run: |
          git add src/content/apps
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Sync app listings and releases'
            git push
          fi

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
